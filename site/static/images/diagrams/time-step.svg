<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="104 4 832 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-model-step-title network-model-step-desc" id="network-model-step-root">
      <title id="network-model-step-title">One time step of the network model</title>
      <desc id="network-model-step-desc">Each step of length dt runs five stages in order, from node densities through pre-movement, walking to the next queue and passing links to applying all transfers at once, then repeats; the walk, pass and apply stages update the shared network state of agents, queues and carries, with link passage highlighted.</desc>
      <defs>
      <style>#network-model-step-root { --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #5a6580;
      --accent: #bf4520; --accent-tint: rgba(191,69,32,0.08); --link: #2e5aa8;
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace; }
      #network-model-step-root { color: var(--ink); font-family: var(--sans); }
      #network-model-step-root .scroll { overflow-x: auto; }
      #network-model-step-root .note { margin-top: 1.25rem; max-width: 46rem; color: var(--muted); font: italic 400 1.05rem/1.45 var(--serif); }
      #network-model-step-root .ring { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #network-model-step-root .spoke { fill: none; stroke: var(--soft); stroke-width: 1; stroke-dasharray: 5 4; }
      #network-model-step-root .station { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
      #network-model-step-root .station.focal { fill: var(--accent-tint); stroke: var(--accent); stroke-width: 1.2; }
      #network-model-step-root .hub { fill: var(--ink); }
      #network-model-step-root .node-name { fill: var(--ink); font: 600 15px var(--sans); text-anchor: middle; }
      #network-model-step-root .focal-name { fill: var(--accent); }
      #network-model-step-root .sublabel { fill: var(--soft); font: 400 11px var(--mono); text-anchor: middle; }
      #network-model-step-root .hub-name { fill: var(--paper); font: 600 18px var(--sans); text-anchor: middle; }
      #network-model-step-root .hub-sub { fill: var(--paper); opacity: 0.72; font: 400 11px var(--mono); text-anchor: middle; }
      #network-model-step-root .arrow-label { fill: var(--soft); font: 400 10px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }</style>
        <pattern id="network-model-step-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
        <marker id="network-model-step-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="network-model-step-arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5a6580"/></marker>
      </defs>
      <rect x="104" y="4" width="832" height="668" fill="#f5f5f5"/>
      <rect x="104" y="4" width="832" height="668" fill="url(#network-model-step-dots)" opacity="0.55"/>

      <path class="ring" d="M636.000 79.334 A300 300 0 0 1 790.809 226.916" marker-end="url(#network-model-step-arrow)"/>
      <path class="ring" d="M814.727 300.000 A300 300 0 0 1 737.015 563.134" marker-end="url(#network-model-step-arrow)"/>
      <path class="ring" d="M627.703 636.000 A300 300 0 0 1 413.418 636.429" marker-end="url(#network-model-step-arrow)"/>
      <path class="ring" d="M303.815 564.000 A300 300 0 0 1 225.051 301.179" marker-end="url(#network-model-step-arrow)"/>
      <path class="ring" d="M248.677 228.000 A300 300 0 0 1 402.894 79.800" marker-end="url(#network-model-step-arrow)"/>
      <path class="spoke" d="M670.0 564.0 L563.9 416.9" marker-end="url(#network-model-step-arrow-soft)"/>
      <path class="spoke" d="M370.0 564.0 L476.1 416.9" marker-end="url(#network-model-step-arrow-soft)"/>
      <path class="spoke" d="M347.1 300.0 L394.3 315.3" marker-end="url(#network-model-step-arrow-soft)"/>
      <rect x="615" y="457" width="54" height="20" rx="4" fill="#f5f5f5"/><text x="642" y="471" class="arrow-label">QUEUES</text>
      <rect x="422" y="503" width="47" height="20" rx="4" fill="#f5f5f5"/><text x="446" y="517" class="arrow-label">CARRY</text>
      <rect x="334" y="322" width="54" height="20" rx="4" fill="#f5f5f5"/><text x="361" y="336" class="arrow-label">AGENTS</text>
      <rect class="station" x="404" y="20" width="232" height="72" rx="6"/>
      <text x="520" y="51" class="node-name">Densities</text><text x="520" y="72" class="sublabel">D per node, by area factor</text>
      <rect class="station" x="688" y="228" width="232" height="72" rx="6"/>
      <text x="804" y="259" class="node-name">Pre-movement</text><text x="804" y="280" class="sublabel">start when t ≥ pre_movement</text>
      <rect class="station" x="580" y="564" width="232" height="72" rx="6"/>
      <text x="696" y="595" class="node-name">Walk to queue</text><text x="696" y="616" class="sublabel">v = min(v_max, k(1 − 0.266 D))</text>
      <rect class="station focal" x="228" y="564" width="232" height="72" rx="6"/>
      <text x="344" y="595" class="node-name focal-name">Pass links</text><text x="344" y="616" class="sublabel">C·dt, carry, counterflow, supply</text>
      <rect class="station" x="120" y="228" width="232" height="72" rx="6"/>
      <text x="236" y="259" class="node-name">Apply transfers</text><text x="236" y="280" class="sublabel">all at once, then t += dt</text>
      <rect class="hub" x="400" y="300" width="240" height="112" rx="8"/>
      <text x="520" y="354" class="hub-name">Network state</text>
      <text x="520" y="380" class="hub-sub">agents, queues, carries</text>
    </svg>
