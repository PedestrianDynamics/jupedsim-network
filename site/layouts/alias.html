<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <title>{{ .Permalink }}</title>
    <link rel="canonical" href="{{ .Permalink }}">
    <meta name="robots" content="noindex">
    <meta charset="utf-8">
    {{- /* The old single page /docs/network-model/ was split into several
         pages. Send its section anchors to the page that now holds them;
         other fragments are kept on the redirect target. */}}
    <script>
      (function () {
        var moved = {
          "limitations": {{ "docs/limitations/" | absURL }},
          "comparison-with-evacuationz": {{ "docs/evacuationz/" | absURL }},
          "verification": {{ "docs/verification/" | absURL }},
          "usage": {{ "docs/getting-started/" | absURL }},
          "model-elements": {{ "docs/model/elements/" | absURL }},
          "nodes": {{ "docs/model/elements/#nodes" | absURL }},
          "links": {{ "docs/model/elements/#links" | absURL }},
          "agents": {{ "docs/model/elements/#agents" | absURL }},
          "routes": {{ "docs/model/elements/#routes" | absURL }},
          "update-scheme": {{ "docs/model/update-scheme/" | absURL }},
          "1-density": {{ "docs/model/update-scheme/#1-density" | absURL }},
          "2-pre-movement": {{ "docs/model/update-scheme/#2-pre-movement" | absURL }},
          "3-walking": {{ "docs/model/update-scheme/#3-walking" | absURL }},
          "4-passing-links": {{ "docs/model/update-scheme/#4-passing-links" | absURL }},
          "5-commit": {{ "docs/model/update-scheme/#5-commit" | absURL }},
          "sensitivity-to-max_density": {{ "docs/verification/#sensitivity-to-max_density" | absURL }},
          "monte-carlo": {{ "docs/ten-storey/#monte-carlo" | absURL }},
          "references": {{ "docs/references/" | absURL }}
        };
        var hash = window.location.hash.slice(1);
        var target = {{ .Permalink }};
        if (hash) {
          target = moved[hash] || target + "#" + hash;
        }
        window.location.replace(target);
      })();
    </script>
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
  </head>
</html>
