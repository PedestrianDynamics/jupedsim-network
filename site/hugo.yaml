baseURL: https://pedestriandynamics.org/jupedsim-network/
languageCode: en-us
title: jupedsim-network

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)'], ['$', '$']]

# last-updated dates from the last commit touching each page
enableGitInfo: true

module:
  imports:
    - path: github.com/imfing/hextra

menu:
  main:
    - name: Documentation
      pageRef: /docs
      weight: 1
    - name: Search
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/PedestrianDynamics/jupedsim-network"
      params:
        icon: github

params:
  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  footer:
    displayCopyright: false
    displayPoweredBy: false

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Hextra loads KaTeX only for pages whose own params set math: true;
  # the docs section sets it in its _index.md cascade.
  math: true
