name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Coverage on one leg (issue #48); the threshold only goes up.
      - run: uv run --extra cli pytest ${{ matrix.python-version == '3.13' && '--cov=jupedsim_network --cov-branch --cov-report=term-missing --cov-fail-under=97' || '' }}

  docs:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.144.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for enableGitInfo (last-updated dates)
      - uses: astral-sh/setup-uv@v6
      # The figures are not in git: regenerate them from the current code,
      # so the site never shows a figure the code can no longer produce.
      - name: Generate figures
        run: |
          uv run --group docs python scripts/figures/make_figures.py
          uv run --group docs python scripts/figures/make_gifs.py
      - name: Read the package version
        run: echo "HUGO_PARAMS_VERSION=$(uv version --short)" >> "$GITHUB_ENV"
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
        working-directory: site
        run: hugo --minify --panicOnWarning
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, docs, docs-numbers]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Documented numbers of long runs (the case study, the max_density
  # sweep, the snippets that call run_many(500) and the time-step example
  # in Limitations); the test job deselects them with -m 'not slow'.
  docs-numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --extra cli pytest -m slow

  # Run time of the base and the head revision on one runner. Reports
  # the ratio in the job summary and warns above 1.5; never fails.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Check out the base revision
        run: git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
      - name: Benchmark
        run: |
          uv run python scripts/bench.py "$RUNNER_TEMP/base" > base.json
          uv run python scripts/bench.py > head.json
          uv run python scripts/bench.py --compare base.json head.json
