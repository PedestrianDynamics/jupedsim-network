name: Publish to PyPI

# PyPI trusts this file by name (trusted publishing); do not rename it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. v0.1.0
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="v$(uv version --short)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match package version $version" >&2
            exit 1
          fi
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
