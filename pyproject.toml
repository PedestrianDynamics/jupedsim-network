[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupedsim-network"
version = "0.4.0"
description = "Coarse network egress model for fast evacuation-time estimates, companion to JuPedSim"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Rich --help; without it the command prints plain argparse help.
cli = ["rich-argparse>=1.8"]
# The terminal UI (jupedsim-network tui); the other commands never import it.
tui = ["textual>=8.2"]

[project.scripts]
jupedsim-network = "jupedsim_network.cli:main"

[project.urls]
Documentation = "https://pedestriandynamics.org/jupedsim-network/"
Source = "https://github.com/PedestrianDynamics/jupedsim-network"
JuPedSim = "https://www.jupedsim.org"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
docs = ["matplotlib==3.10.8"]
# SVG snapshots of the terminal UI; it pulls in textual, so only the CI
# leg that tests the TUI installs it.
tui-test = ["pytest-textual-snapshot>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/jupedsim_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not fuzz and not slow'"
markers = [
    "fuzz: long property and fuzz runs of the scheduled job (fuzz.yml)",
    "slow: documented numbers of long runs, in their own CI job",
]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
