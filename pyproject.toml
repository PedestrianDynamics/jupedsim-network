[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jupedsim-network"
version = "0.1.0"
description = "Coarse network egress model for fast RSET estimates, companion to JuPedSim"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.urls]
Source = "https://github.com/PedestrianDynamics/jupedsim-network"
JuPedSim = "https://www.jupedsim.org"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4",
    "sphinx-book-theme>=1.1",
    "matplotlib==3.10.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/jupedsim_network"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
